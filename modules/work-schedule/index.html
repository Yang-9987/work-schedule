<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>作息时间表 · 校园工作台</title>
<link rel="stylesheet" href="/assets/css/app-shell.css?v=3">
<style>
  :root {
    --primary: #2b6cff;
    --primary-light: #e8efff;
    --success: #12b76a;
    --success-light: #e7f8f0;
    --warning: #f79009;
    --warning-light: #fef3e2;
    --danger: #f04438;
    --text: #1a2233;
    --text-2: #5a6478;
    --text-3: #98a2b3;
    --bg: #f3f5f9;
    --card: #ffffff;
    --line: #e9edf3;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    max-width: 540px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .module-nav { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

  /* ===== 顶部状态卡 ===== */
  .hero {
    background: linear-gradient(135deg, #2b6cff 0%, #5a3fff 100%);
    color: #fff;
    padding: 26px 20px 68px;
    border-radius: 0 0 26px 26px;
    position: relative;
  }

  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; padding-right: 40px; }
  .hero-date { font-size: 13px; opacity: .85; }
  .hero-week { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .hero-clock { text-align: right; font-variant-numeric: tabular-nums; }
  .hero-clock .time { font-size: 30px; font-weight: 700; letter-spacing: 1px; line-height: 1.1; }
  .hero-clock .sec { font-size: 12px; opacity: .8; }
  .hero-status {
    margin-top: 18px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #7dffce; box-shadow: 0 0 8px #7dffce; animation: pulse 1.6s infinite; flex-shrink: 0; }
  .status-dot.rest { background: #ffd580; box-shadow: 0 0 8px #ffd580; }
  .status-dot.off { background: #c3cade; box-shadow: none; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .status-main { font-size: 17px; font-weight: 700; }
  .status-sub { font-size: 12px; opacity: .85; margin-top: 1px; }

  .today-card {
    background: var(--card); border-radius: var(--radius);
    margin: -48px 14px 14px; padding: 16px;
    box-shadow: 0 4px 18px rgba(26,34,51,.07); position: relative;
  }
  .today-card h3 { font-size: 13px; color: var(--text-2); font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .today-card h3 .pct { color: var(--primary); font-variant-numeric: tabular-nums; }
  .progress-track { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #2b6cff, #5a3fff); width: 0%; transition: none; }
  .progress-marks { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .section-title { margin: 20px 16px 10px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .section-title::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--primary); }

  .timeline { padding: 0 16px; }
  .tl-item {
    background: var(--card); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; border: 1.5px solid transparent; transition: all .3s;
  }
  .tl-item.now { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 4px 14px rgba(43,108,255,.15); }
  .tl-item.past { opacity: .55; }
  .tl-time { min-width: 92px; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
  .tl-time .range { color: var(--text); }
  .tl-time .single { color: var(--primary); }
  .tl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
  .tl-item.now .tl-dot { background: var(--primary); box-shadow: 0 0 0 4px rgba(43,108,255,.2); }
  .tl-body { flex: 1; }
  .tl-name { font-weight: 600; font-size: 15px; }
  .tl-desc { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .tl-tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; flex-shrink: 0; }
  .tag-work { background: var(--primary-light); color: var(--primary); }
  .tag-rest { background: var(--success-light); color: var(--success); }
  .tag-key { background: var(--warning-light); color: var(--warning); }
  .tag-student-entry { background: #ccfbf1; color: #0f766e; }
  .tag-lesson { background: #dbeafe; color: #1d4ed8; }
  .tag-recess { background: #dcfce7; color: #15803d; }
  .tag-eye-exercise { background: #f3e8ff; color: #7e22ce; }
  .tag-lunch { background: #ffedd5; color: #c2410c; }
  .tag-hygiene { background: #fee2e2; color: #b91c1c; }
  .tag-broadcast { background: #e0e7ff; color: #4338ca; }
  .tag-nap { background: #cffafe; color: #0e7490; }
  .tag-club { background: #fce7f3; color: #be185d; }
  .tag-now { background: var(--primary); color: #fff; }
  .tl-item.now .tl-name::after { content: " · 进行中"; font-size: 11px; color: var(--primary); font-weight: 500; }

  .week-card { background: var(--card); border-radius: var(--radius); margin: 0 16px; padding: 14px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .week-day { text-align: center; padding: 8px 0; border-radius: 10px; font-size: 12px; }
  .week-day .d { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .week-day .l { color: var(--text-3); margin-top: 2px; }
  .week-day.rest .l { color: var(--success); }
  .week-day.today { background: var(--primary); color: #fff; }
  .week-day.today .l { color: rgba(255,255,255,.8); }
  .week-day.today .d { color: #fff; }

  .tips { margin: 0 16px; background: var(--warning-light); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: #9a6a1a; line-height: 1.7; }
  .tips b { color: #7a4f07; }

  .footer { text-align: center; color: var(--text-3); font-size: 11px; margin-top: 22px; }

  .local-preview-note { max-width: 520px; margin: 14px auto 0; padding: 9px 14px; color: #315d4e; border: 1px solid #b7d8ca; border-radius: 10px; background: #e8f5ef; font-size: 12px; text-align: center; }
</style>
<link rel="stylesheet" href="/assets/css/work-schedule.css?v=20260906-public4">
</head>
<body>

<nav class="module-nav" aria-label="网站导航">
  <a class="module-nav__brand" href="/">校园工作台</a>
  <div class="module-nav__links">
    <a href="/work-schedule/" aria-current="page">作息时间表</a>
    <a href="/school-calendar/">校历</a>
    <a href="/duty-roster/">值班排班</a>
  </div>
</nav>
<div class="local-preview-note" id="localPreviewNote" hidden>本地预览 · 数据尚未同步到线上</div>

<!-- ==================== 展示端 ==================== -->
<div id="viewer">
  <h1 class="page-title">作息时间表</h1>
  <div class="schedule-summary">
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-date" id="heroDate"></div>
        <div class="hero-week" id="heroWeek"></div>
      </div>
      <div class="hero-clock">
        <div class="time" id="heroClock">--:--</div>
        <div class="sec" id="heroSec"></div>
      </div>
    </div>
    <div class="hero-status">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div class="status-main" id="statusMain">加载中…</div>
        <div class="status-sub" id="statusSub"></div>
      </div>
    </div>
  </div>

  <div class="today-card">
    <h3><span>今日工作进度</span><span class="pct" id="dayPct">--%</span></h3>
    <div class="progress-track"><div class="progress-bar" id="dayBar"></div></div>
    <div class="progress-marks" id="progressMarks"></div>
  </div>

  <div class="section-title">本周安排</div>
  <div class="week-card" id="weekCard"></div>

  <div class="section-title" id="tipsTitle">作息提示</div>
  <div class="tips" id="tipsBox"></div>

  <div class="footer">校园工作台 · 作息时间表</div>
  </div>
  <section class="schedule-timeline" aria-label="每日作息时间轴">
    <div class="section-title timeline-title">每日作息时间轴</div>
    <div class="timeline" id="timeline"></div>
  </section>
</div>

<script>
/* =====================================================
 * 默认配置（首次使用 / 无 config.json 时的兜底数据）
 * ===================================================== */
var DEFAULT_CONFIG = { company: "", schedule: [], workdays: [false,true,true,true,true,true,false], tips: [] };
var WEEK_NAMES = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
var TYPE_META = {
  work:          { label: "工作",         className: "tag-work" },
  rest:          { label: "休息",         className: "tag-rest" },
  key:           { label: "关键节点",     className: "tag-key" },
  student_entry: { label: "学生入校",     className: "tag-student-entry" },
  lesson:        { label: "上课",         className: "tag-lesson" },
  recess:        { label: "大课间活动",   className: "tag-recess" },
  eye_exercise:  { label: "眼保健操时间", className: "tag-eye-exercise" },
  lunch:         { label: "午餐时间",     className: "tag-lunch" },
  hygiene:       { label: "卫生检查",     className: "tag-hygiene" },
  broadcast:     { label: "校园广播",     className: "tag-broadcast" },
  nap:           { label: "午休时间",     className: "tag-nap" },
  club:          { label: "社团",         className: "tag-club" }
};
var cfg = null;          // 当前生效配置
var LOCAL_PREVIEW = false;
try { LOCAL_PREVIEW = new URLSearchParams(location.search).get("localPreview") === "1"; } catch (e) {}

/* ============ 配置加载链：URL?config= → /config.json → 本机保存 → 默认 ============ */
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function normalizeTime(t){
  if (typeof t !== "string") return "";
  t = t.trim();
  var m = t.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return "";
  var h = +m[1], mi = +m[2];
  if (h > 23 || mi > 59) return "";
  return pad(h) + ":" + pad(mi);
}
function normalizeConfig(j){
  var c = { company: j.company || DEFAULT_CONFIG.company,
            schedule: [], workdays: [false,true,true,true,true,true,false], tips: [] };
  if (Array.isArray(j.workdays) && j.workdays.length === 7) c.workdays = j.workdays.map(Boolean);
  (Array.isArray(j.schedule) ? j.schedule : []).forEach(function(it){
    var start = normalizeTime(it.start);
    if (!start) return;
    c.schedule.push({
      name: String(it.name || "未命名"),
      start: start,
      end: it.end ? normalizeTime(it.end) : "",
      type: TYPE_META[it.type] ? it.type : "work",
      desc: String(it.desc || "")
    });
  });
  if (!c.schedule.length) c.schedule = deepCopy(DEFAULT_CONFIG.schedule);
  c.tips = (Array.isArray(j.tips) ? j.tips : []).map(String).filter(function(t){ return t.trim(); });
  if (!c.tips.length) c.tips = deepCopy(DEFAULT_CONFIG.tips);
  return c;
}
function loadLocal(){ return deepCopy(DEFAULT_CONFIG); }
function fetchJson(url){
  return fetch(url + "?t=" + Date.now()).then(function(r){
    if (!r.ok) throw new Error("not found");
    return r.json();
  });
}
function loadConfig(cb){
  var qp = null;
  try { qp = new URLSearchParams(location.search).get("config"); } catch (e) {}
  if (LOCAL_PREVIEW) {
    fetch("/api/local-console/page-preview?moduleId=work-schedule&t=" + Date.now(), {
      headers: { "Authorization": "Bearer " + (sessionStorage.getItem("localConsoleToken") || "") }
    }).then(function(r){
      return r.json().then(function(body){
        if (!r.ok || !body.preview) throw new Error(body.error || "无法读取本地预览");
        return body.preview.data;
      });
    }).then(function(j){
      cfg = normalizeConfig(j);
      document.getElementById("localPreviewNote").hidden = false;
      cb();
    }).catch(function(error){
      cfg = deepCopy(DEFAULT_CONFIG);
      var note = document.getElementById("localPreviewNote");
      note.hidden = false;
      note.textContent = error.message + "，请返回本地工作台重新生成。";
      cb();
    });
    return;
  }
  if (qp) {
    // 1) 强制指定配置源（测试/多套作息）
    fetchJson(qp).then(function(j){ cfg = normalizeConfig(j); cb(); })
      .catch(function(){ cfg = loadLocal(); cb(); });
    return;
  }
  // 读取公开作息数据
  fetchJson("/api/schedule").then(function(j){
    cfg = normalizeConfig(j);
    cb();
  }).catch(function(){
    // 3) 服务器静态文件 config.json
    fetchJson("/config.json").then(function(j){
      cfg = normalizeConfig(j);
      cb();
    }).catch(function(){
      // 4) 本机保存 → 5) 内置默认
      cfg = loadLocal();
      cb();
    });
  });
}

/* ============ 工具 ============ */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function toMin(hm){ var p = hm.split(":"); return (+p[0]) * 60 + (+p[1]); }
function nowMin(d){ return d.getHours() * 60 + d.getMinutes(); }
function getCurrent(list, now){
  for (var i = 0; i < list.length; i++){
    var it = list[i], s = toMin(it.start), e = it.end ? toMin(it.end) : s + 15;
    if (now >= s && now < e) return it;
  }
  return null;
}
function nextEvent(list, now){
  for (var i = 0; i < list.length; i++){
    if (now < toMin(list[i].start)) return list[i];
  }
  return null;
}


/* ============ 展示端渲染 ============ */
function renderHero(now){
  var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate(), wd = now.getDay();
  document.getElementById("heroDate").textContent = y + " 年 " + m + " 月 " + d + " 日";
  document.getElementById("heroWeek").textContent = WEEK_NAMES[wd] + (cfg.workdays[wd] ? " · 工作日" : " · 休息日");
  document.getElementById("heroClock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  document.getElementById("heroSec").textContent = pad(now.getSeconds()) + " 秒 · " + cfg.company;

  var isWorkday = cfg.workdays[wd];
  var cur = isWorkday ? getCurrent(cfg.schedule, nowMin(now)) : null;
  var nxt = isWorkday ? nextEvent(cfg.schedule, nowMin(now)) : null;
  var main, sub, dot = document.getElementById("statusDot");
  dot.className = "status-dot";

  if (!cfg.schedule.length) { main = "暂无作息安排"; sub = ""; dot.classList.add("off");
  } else if (!isWorkday) {
    main = "今日休息日"; sub = "本周安排见下方"; dot.classList.add("rest");
  } else if (cur) {
    main = "当前：" + cur.name;
    if (cur.end) {
      var left = toMin(cur.end) - nowMin(now);
      sub = left > 60 ? ("距结束约 " + Math.round(left / 60 * 10) / 10 + " 小时") : ("距结束还有 " + left + " 分钟");
    } else { sub = "时间点：" + cur.start; }
    if (cur.type === "rest") dot.classList.add("rest");
  } else if (nxt) {
    main = "休息间隙";
    var wait = toMin(nxt.start) - nowMin(now);
    sub = "下一项：" + nxt.name + "（" + (wait > 60 ? Math.round(wait / 60 * 10) / 10 + " 小时后" : wait + " 分钟后") + "）";
  } else {
    main = "今日作息已结束"; sub = ""; dot.classList.add("off");
  }
  document.getElementById("statusMain").textContent = main;
  document.getElementById("statusSub").textContent = sub;
}
function escapeText(value){ return String(value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function renderTimeline(now){
  var wrap = document.getElementById("timeline"), nm = nowMin(now), wd = now.getDay();
  var cur = cfg.workdays[wd] ? getCurrent(cfg.schedule, nm) : null;
  wrap.innerHTML = cfg.schedule.length ? "" : '<div class="empty-state">暂无作息数据，请稍后刷新重试。</div>';
  cfg.schedule.forEach(function(it){
    var s = toMin(it.start), e = it.end ? toMin(it.end) : s;
    var el = document.createElement("div");
    el.className = "tl-item";
    if (cur === it) el.classList.add("now");
    else if (nm >= e) el.classList.add("past");
    var timeHtml = it.end
      ? '<span class="range">' + it.start + " - " + it.end + '</span>'
      : '<span class="single">' + it.start + '</span>';
    var typeMeta = TYPE_META[it.type] || TYPE_META.work;
    var tagClass = typeMeta.className;
    var tagText = typeMeta.label;
    el.innerHTML =
      '<div class="tl-time">' + timeHtml + '</div>' +
      '<div class="tl-dot"></div>' +
      '<div class="tl-body"><div class="tl-name">' + escapeText(it.name) + '</div>' +
      (it.desc ? '<div class="tl-desc">' + escapeText(it.desc) + '</div>' : '') + '</div>' +
      '<div class="tl-tag ' + (cur === it ? "tag-now" : tagClass) + '">' + (cur === it ? "进行中" : tagText) + '</div>';
    wrap.appendChild(el);
  });
}
function renderProgress(now){
  if (!cfg.schedule.length) { document.getElementById("dayPct").textContent = "—"; document.getElementById("dayBar").style.width = "0%"; return; }
  var wd = now.getDay();
  if (!cfg.workdays[wd]) {
    document.getElementById("dayPct").textContent = "休息日";
    document.getElementById("dayBar").style.width = "0%";
    document.getElementById("progressMarks").innerHTML = "<span>今日休息</span>";
    return;
  }
  var s = toMin(cfg.schedule[0].start);
  var last = cfg.schedule[cfg.schedule.length - 1];
  var e = toMin(last.end || last.start);
  var nm = nowMin(now);
  var pct = Math.max(0, Math.min(100, (e > s ? (nm - s) / (e - s) * 100 : nm >= s ? 100 : 0)));
  document.getElementById("dayPct").textContent = Math.round(pct) + "%";
  document.getElementById("dayBar").style.width = pct + "%";
  document.getElementById("progressMarks").innerHTML =
    "<span>" + cfg.schedule[0].start + "</span><span>" + (last.end || last.start) + "</span>";
}
function renderWeek(now){
  var card = document.getElementById("weekCard");
  card.innerHTML = "";
  var day = new Date(now);
  day.setDate(now.getDate() - ((now.getDay() + 6) % 7)); // 本周一
  for (var i = 0; i < 7; i++){
    var idx = day.getDay();
    var isToday = day.toDateString() === now.toDateString();
    var cls = "week-day" + (cfg.workdays[idx] ? "" : " rest") + (isToday ? " today" : "");
    var label = cfg.workdays[idx] ? "上班" : "休";
    card.innerHTML += '<div class="' + cls + '"><div class="d">' + day.getDate() + '</div><div class="l">' + label + '</div></div>';
    day.setDate(day.getDate() + 1);
  }
}
function renderTips(){
  document.getElementById("tipsTitle").hidden = !cfg.tips.length;
  document.getElementById("tipsBox").hidden = !cfg.tips.length;
  document.getElementById("tipsBox").innerHTML =
    cfg.tips.map(function(t){ return "<div>· " + escapeText(t) + "</div>"; }).join("");
}
function renderViewer(){
  var now = new Date();
  renderHero(now); renderTimeline(now); renderProgress(now); renderWeek(now); renderTips();
}

/* ============ 主循环 ============ */
var lastMinute = -1;
function tick(){
  var now = new Date();
  if (now.getSeconds() % 2 === 0) {
    document.getElementById("heroSec").textContent = pad(now.getSeconds()) + " 秒 · " + cfg.company;
  }
  if (now.getMinutes() !== lastMinute) {
    lastMinute = now.getMinutes();
    renderHero(now); renderTimeline(now); renderProgress(now); renderWeek(now);
  }
}
loadConfig(function(){
  renderViewer();
  tick();
  setInterval(tick, 1000);
});
</script>
</body>
</html>
