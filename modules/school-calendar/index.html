<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183247">
  <title>校历 · 校园工作台</title>
  <link rel="stylesheet" href="/assets/css/app-shell.css?v=3">
  <link rel="stylesheet" href="/assets/css/calendar.css?v=3">
</head>
<body class="calendar-page">
  <nav class="module-nav" aria-label="网站导航">
    <a class="module-nav__brand" href="/">校园工作台</a>
    <div class="module-nav__links"><a href="/work-schedule/">作息时间表</a><a href="/school-calendar/" aria-current="page">校历</a><a href="/duty-roster/">值班排班</a></div>
  </nav>
  <main class="calendar-shell" id="calendarApp">
    <header class="calendar-header"><div><p class="eyebrow" id="calendarYear">2026—2027 学年</p><h1>校历</h1><p id="calendarMode">按日期查看校园安排</p></div></header>
    <section class="calendar-toolbar" aria-label="月份选择"><button id="prevMonth" type="button" aria-label="上个月">←</button><h2 id="monthTitle">加载中…</h2><button id="nextMonth" type="button" aria-label="下个月">→</button><button id="todayButton" class="today-button" type="button">回到今天</button></section>
    <div class="calendar-layout">
      <section class="calendar-card" aria-label="月历"><div class="weekday-row" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="month-grid" id="monthGrid"></div></section>
      <aside class="event-panel" id="eventPanel"><div class="event-panel__heading"><div><p class="eyebrow">日期事项</p><h2 id="eventListTitle">本月事件</h2></div><span id="eventCount">0 项</span></div><button id="showAllEvents" class="all-events-button" type="button" hidden>查看本月全部</button><div id="eventList" class="event-list" aria-live="polite"></div></aside>
    </div>
  </main>
  <script src="/assets/js/calendar-text.js?v=1" defer></script><script src="/assets/js/calendar.js?v=6" defer></script>
</body>
</html>
