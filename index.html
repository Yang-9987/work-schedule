<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f5f">
  <title>首师附一小 · 校园工作台</title>
  <link rel="stylesheet" href="/assets/css/app-shell.css?v=3">
</head>
<body class="portal-page">
  <header class="portal-hero">
    <div class="portal-hero__inner">
      <p class="eyebrow">首师附一小 · 2026—2027 第一学期</p>
      <h1>校园工作台</h1>
      <div class="date-stamp" aria-label="今天日期">
        <span id="todayMonth">--月</span>
        <strong id="todayDay">--</strong>
        <span id="todayWeek">星期-</span>
      </div>
    </div>
  </header>

  <main class="portal-main">
    <div class="section-heading">
      <div>
        <h2>日程查询</h2>
      </div>
      <span>3 个功能</span>
    </div>

    <section class="module-grid" aria-label="功能列表">
      <a class="module-card module-card--schedule" href="/work-schedule/">
        <span class="module-card__index">日</span>
        <div>
          <p class="module-card__meta">每日安排</p>
          <h3>作息时间表</h3>
          <p>当前时段、每日作息与一周工作日。</p>
        </div>
        <span class="module-card__action">进入作息 <span aria-hidden="true">→</span></span>
      </a>

      <a class="module-card module-card--calendar" href="/school-calendar/">
        <span class="module-card__index">月</span>
        <div>
          <p class="module-card__meta">学期安排</p>
          <h3>校历</h3>
          <p>按日期查看学期事件和每日安排。</p>
        </div>
        <span class="module-card__action">进入校历 <span aria-hidden="true">→</span></span>
      </a>

      <a class="module-card module-card--duty" href="/duty-roster/">
        <span class="module-card__index">值</span>
        <div>
          <p class="module-card__meta">值周安排</p>
          <h3>值班排班</h3>
          <p>查看今日值班、本周排班，查询个人值班日期和值周须知。</p>
        </div>
        <span class="module-card__action">进入值班 <span aria-hidden="true">→</span></span>
      </a>
    </section>
  </main>

  <footer class="portal-footer">首师附一小 · 校园工作台</footer>
  <script src="/assets/js/app-shell.js" defer></script>
</body>
</html>
