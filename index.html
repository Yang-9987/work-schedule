<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f5f">
  <title>首师附一小 · 校园工作台</title>
  <link rel="stylesheet" href="/assets/css/app-shell.css">
</head>
<body class="portal-page">
  <header class="portal-hero">
    <div class="portal-hero__inner">
      <p class="eyebrow">2026—2027 第一学期</p>
      <h1>校园工作台</h1>
      <p class="portal-intro">把每天的时间安排与整学期的重要日期，放进同一个清晰、易维护的入口。</p>
      <div class="date-stamp" aria-label="今天日期">
        <span id="todayMonth">--月</span>
        <strong id="todayDay">--</strong>
        <span id="todayWeek">星期-</span>
      </div>
    </div>
  </header>

  <main class="portal-main">
    <div class="section-heading">
      <div>
        <p class="eyebrow">常用工具</p>
        <h2>今天从哪里开始？</h2>
      </div>
      <span>2 个功能</span>
    </div>

    <section class="module-grid" aria-label="功能列表">
      <a class="module-card module-card--schedule" href="/work-schedule/">
        <span class="module-card__index">日</span>
        <div>
          <p class="module-card__meta">每日安排</p>
          <h3>作息时间表</h3>
          <p>查看当前时段、今日进度和一周工作日，管理员可维护并发布作息。</p>
        </div>
        <span class="module-card__action">进入作息 <span aria-hidden="true">→</span></span>
      </a>

      <a class="module-card module-card--calendar module-card--developing" href="/school-calendar/">
        <span class="module-card__status">开发中</span>
        <span class="module-card__index">月</span>
        <div>
          <p class="module-card__meta">学期安排</p>
          <h3>校历</h3>
          <p>校历功能正在建设中，可以进入页面查看开发状态；管理员可登录维护校历内容。</p>
        </div>
        <span class="module-card__action">查看进度 <span aria-hidden="true">→</span></span>
      </a>
    </section>
  </main>

  <footer class="portal-footer">首师附一小 · 校园工作台　·　<a href="/admin/mappings/">管理后台</a></footer>
  <script src="/assets/js/app-shell.js" defer></script>
</body>
</html>
